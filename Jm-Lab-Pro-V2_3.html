function getSliders(){
  var container = document.querySelector(".space-y-3.mb-4");
  if(!container) return [];
  return Array.prototype.slice.call(container.querySelectorAll('input[type="range"]'));
}

// Trick to update a React-controlled <input> from outside React:
// use the native setter then dispatch a real "input" event so React's
// onChange fires normally.
function setNativeValue(input, value){
  var proto = window.HTMLInputElement.prototype;
  var setter = Object.getOwnPropertyDescriptor(proto, "value").set;
  setter.call(input, String(value));
  input.dispatchEvent(new Event("input", { bubbles: true }));
}

function loadPresets(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function savePresets(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function readCurrentValues(){
  var sliders = getSliders();
  var values = {};
  LABELS.forEach(function(label, i){
    values[label] = sliders[i] ? Number(sliders[i].value) : 0;
  });
  return values;
}

function applyValues(values){
  var sliders = getSliders();
  LABELS.forEach(function(label, i){
    if(sliders[i] && values[label] !== undefined){
      setNativeValue(sliders[i], values[label]);
    }
  });
}

fab.className = "jmp-fab";

var overlay = null;

function closePanel(){
  if(overlay){ overlay.remove(); overlay = null; }
  stopCamera();
}

function openPanel(){
  closePanel();
  overlay = document.createElement("div");
  overlay.className = "jmp-overlay";
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closePanel(); });

  var panel = document.createElement("div");
  panel.className = "jmp-panel";
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  renderPanel(panel);
}

function renderPanel(panel){
  panel.innerHTML = "";

  var closeBtn = document.createElement("button");
  closeBtn.className = "jmp-close";
  closeBtn.textContent = "✕";
  closeBtn.onclick = closePanel;
  panel.appendChild(closeBtn);

  var title = document.createElement("div");
  title.style.cssText = "font-weight:900;font-size:14px;letter-spacing:.05em;margin-bottom:4px;";
  title.textContent = "🎛️ MES PRESETS";
  panel.appendChild(title);

  // Save current
  var saveBtn = document.createElement("button");
  saveBtn.className = "jmp-full jmp-yellow";
  saveBtn.textContent = "💾 Enregistrer les reglages actuels";
  saveBtn.onclick = function(){
    var name = prompt("Nom du preset :");
    if(!name) return;
    var list = loadPresets();
    list.push({ name: name, values: readCurrentValues(), date: new Date().toISOString() });
    savePresets(list);
    renderPanel(panel);
  };
  panel.appendChild(saveBtn);

  // List
  var h1 = document.createElement("h3");
  h1.textContent = "Presets enregistres";
  panel.appendChild(h1);

  var list = loadPresets();
  if(list.length === 0){
    var empty = document.createElement("div");
    empty.className = "jmp-hint";
    empty.textContent = "Aucun preset pour le moment.";
    panel.appendChild(empty);
  }
  list.forEach(function(preset, idx){
    var row = document.createElement("div");
    row.className = "jmp-row";

    var name = document.createElement("span");
    name.textContent = preset.name;
    row.appendChild(name);

    var btns = document.createElement("div");
    btns.className = "jmp-btns";

    var applyBtn = document.createElement("button");
    applyBtn.className = "jmp-apply";
    applyBtn.textContent = "Appliquer";
    applyBtn.onclick = function(){
      applyValues(preset.values);
      closePanel();
    };
    btns.appendChild(applyBtn);

    var delBtn = document.createElement("button");
    delBtn.className = "jmp-del";
    delBtn.textContent = "Suppr.";
    delBtn.onclick = function(){
      var l = loadPresets();
      l.splice(idx, 1);
      savePresets(l);
      renderPanel(panel);
    };
    btns.appendChild(delBtn);

    row.appendChild(btns);
    panel.appendChild(row);
  });

  // QR section
  var h2 = document.createElement("h3");
  h2.textContent = "Partage QR (format maison)";
  panel.appendChild(h2);

  var hint = document.createElement("div");
  hint.className = "jmp-hint";
  hint.textContent = "Exporte tes presets en QR pour les transferer sur un autre appareil, ou scanne un QR genere par cette appli.";
  panel.appendChild(hint);

  var exportBtn = document.createElement("button");
  exportBtn.className = "jmp-full jmp-white";
  exportBtn.textContent = "📤 Exporter mes presets en QR";
  exportBtn.onclick = function(){ exportQR(panel, list); };
  panel.appendChild(exportBtn);

  scanBtn.className = "jmp-full jmp-blue";
  scanBtn.textContent = "📷 Scanner un QR";
  scanBtn.onclick = function(){ startScan(panel); };
  panel.appendChild(scanBtn);

  var h3 = document.createElement("h3");
  h3.textContent = "Depuis Snapseed";
  panel.appendChild(h3);

  var snapHint = document.createElement("div");
  snapHint.className = "jmp-hint";
  snapHint.textContent = "Le format des QR Snapseed est proprietaire et fermé : cette appli peut scanner le QR et t'afficher son contenu brut, mais ne peut pas l'interpreter automatiquement. Utilise la saisie manuelle pour recopier les valeurs.";

function exportQR(panel, list){
  if(list.length === 0){ alert("Aucun preset a exporter."); return; }
  var payload = JSON.stringify({ jmlabPreset: true, presets: list });
  var old = document.getElementById("jmp-qr-canvas");
  if(old) old.remove();
  var canvas = document.createElement("canvas");
  canvas.id = "jmp-qr-canvas";
  panel.appendChild(canvas);
  if(window.QRCode && window.QRCode.toCanvas){
    window.QRCode.toCanvas(canvas, payload, { width: 260 }, function(err){
      if(err){ alert("Erreur generation QR (trop de presets ?)."); canvas.remove(); }
    });
  } else {
    canvas.remove();
    alert(
      "Impossible de generer le QR : le petit composant necessaire n'a pas pu se charger.\n\n" +
      "Cause la plus frequente : la page est ouverte comme un simple fichier local " +
      "(file://) ou hors ligne. Pour que cette fonction marche, heberge le fichier HTML " +
      "en ligne via une adresse https:// (par ex. GitHub Pages, Netlify) et connecte-toi " +
      "a internet au moment de generer le QR.\n\n" +
      "Toutes les autres fonctions (retouche, presets Fuji, export HD, lot ZIP) marchent " +
      "normalement sans connexion."
    );
  }
}

var stream = null;
var scanRAF = null;

function stopCamera(){
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF = null; }
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
}

function startScan(panel){
  var old = document.getElementById("jmp-video");
  if(old) old.remove();
  var oldRaw = document.getElementById("jmp-raw");
  if(oldRaw) oldRaw.remove();

  var video = document.createElement("video");
  video.id = "jmp-video";
  video.setAttribute("playsinline", "true");
  panel.appendChild(video);

  if(!window.jsQR){
    alert(
      "Impossible d'activer le scan : le petit composant necessaire n'a pas pu se charger.\n\n" +
      "Cause la plus frequente : la page est ouverte comme un simple fichier local " +
      "(file://) ou hors ligne. Pour que cette fonction marche, heberge le fichier HTML " +
      "en ligne via une adresse https:// (par ex. GitHub Pages, Netlify) et connecte-toi " +
      "a internet au moment de scanner.\n\n" +
      "Toutes les autres fonctions (retouche, presets Fuji, export HD, lot ZIP) marchent " +
      "normalement sans connexion."
    );
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert(
      "La camera n'est pas accessible depuis cette page.\n\n" +
      "Les navigateurs bloquent l'acces camera sauf sur une adresse securisee (https://) " +
      "ou en local via localhost. Si le fichier est ouvert directement (file://) ou via " +
      "http:// simple, la camera restera indisponible : heberge l'appli en https:// " +
      "(par ex. GitHub Pages, Netlify) pour debloquer le scan QR."
    );
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function(s){
    stream = s;
    video.srcObject = s;
    video.play();
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d");

    function tick(){
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = window.jsQR(img.data, img.width, img.height);
        if(code && code.data){
          stopCamera();
          video.remove();
          handleScanResult(panel, code.data);
          return;
        }
      }
      scanRAF = requestAnimationFrame(tick);
    }
    scanRAF = requestAnimationFrame(tick);
  }).catch(function(err){
    if(err && err.name === "NotAllowedError"){
      alert(
        "Acces camera refuse.\n\n" +
        "Le navigateur a mémorisé un refus d'autorisation pour ce site. Va dans les " +
        "reglages du navigateur (icone cadenas ou ⓘ pres de la barre d'adresse) > " +
        "Autorisations du site > Camera, puis choisis Autoriser, et reessaie."
      );
    } else if(err && err.name === "NotFoundError"){
      alert("Aucune camera detectee sur cet appareil.");
    } else if(location.protocol !== "https:" && location.hostname !== "localhost"){
      alert(
        "Impossible d'acceder a la camera depuis cette adresse (" + location.protocol + ").\n\n" +
        "Les navigateurs exigent une connexion securisee (https://) pour autoriser la " +
        "camera. Heberge ce fichier HTML en ligne via une adresse https:// (par ex. " +
        "GitHub Pages, Netlify) pour que le scan QR fonctionne."
      );
    } else {
      alert("Impossible d'acceder a la camera : " + (err && err.message ? err.message : err));
    }
  });
}

function handleScanResult(panel, text){
  var parsed = null;
  try{ parsed = JSON.parse(text); }catch(e){}

  if(parsed && parsed.jmlabPreset && Array.isArray(parsed.presets)){
    var list = loadPresets();
    parsed.presets.forEach(function(p){ list.push(p); });
    savePresets(list);
    alert(parsed.presets.length + " preset(s) importe(s) !");
    renderPanel(panel);
    return;
  }

  // Not our format (likely a Snapseed QR or something else) — show raw content.
  var rawBox = document.createElement("div");
  rawBox.id = "jmp-raw";
  rawBox.className = "jmp-raw";
  rawBox.textContent = "Contenu brut du QR (non reconnu) :\n" + text;
  panel.appendChild(rawBox);
}

function openManualEntry(panel){
  var old = document.getElementById("jmp-manual-form");
  if(old){ old.remove(); return; }

  var form = document.createElement("div");
  form.id = "jmp-manual-form";
  form.className = "jmp-manual";

  var nameLabel = document.createElement("label");
  nameLabel.textContent = "Nom du preset";
  form.appendChild(nameLabel);
  var nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.placeholder = "Ex: Snapseed Vintage";
  form.appendChild(nameInput);

  var inputs = {};
  LABELS.forEach(function(label){
    var l = document.createElement("label");
    l.textContent = label;
    form.appendChild(l);
    var inp = document.createElement("input");
    inp.type = "number";
    inp.value = "0";
    form.appendChild(inp);
    inputs[label] = inp;
  });

  var saveBtn = document.createElement("button");
  saveBtn.className = "jmp-full jmp-yellow";
  saveBtn.style.marginTop = "10px";
  saveBtn.textContent = "Enregistrer ce preset";
  saveBtn.onclick = function(){
    if(!nameInput.value){ alert("Donne un nom au preset."); return; }
    var values = {};
    LABELS.forEach(function(label){ values[label] = Number(inputs[label].value) || 0; });
    var list = loadPresets();
    list.push({ name: nameInput.value, values: values, date: new Date().toISOString() });
    savePresets(list);
    renderPanel(panel);
  };
  form.appendChild(saveBtn);

  panel.appendChild(form);
}

fab.addEventListener("click", openPanel);

// ---- CRC32 (standard table-based implementation) ----
var CRC_TABLE = (function(){
  var table = new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c = n;
    for(var k=0;k<8;k++){
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes){
  var crc = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++){
    crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function writeUint32LE(arr, offset, val){
  arr[offset] = val & 0xFF;
  arr[offset+1] = (val >>> 8) & 0xFF;
  arr[offset+2] = (val >>> 16) & 0xFF;
  arr[offset+3] = (val >>> 24) & 0xFF;
}
function writeUint16LE(arr, offset, val){
  arr[offset] = val & 0xFF;
  arr[offset+1] = (val >>> 8) & 0xFF;
}

function dosDateTime(date){
  var time = ((date.getHours() & 0x1F) << 11) | ((date.getMinutes() & 0x3F) << 5) | ((date.getSeconds() >> 1) & 0x1F);
  var day = (((date.getFullYear()-1980) & 0x7F) << 9) | (((date.getMonth()+1) & 0xF) << 5) | (date.getDate() & 0x1F);
  return { time: time & 0xFFFF, date: day & 0xFFFF };
}

// files: [{name: string, data: Uint8Array}]
// returns a Blob (application/zip)
window.__jmpCreateZip = function(files){
  var now = dosDateTime(new Date());
  var localParts = [];
  var centralParts = [];
  var offset = 0;

  files.forEach(function(f){
    var nameBytes = new TextEncoder().encode(f.name);
    var data = f.data;
    var crc = crc32(data);
    var size = data.length;

    var localHeader = new Uint8Array(30 + nameBytes.length);
    writeUint32LE(localHeader, 0, 0x04034b50);
    writeUint16LE(localHeader, 4, 20);        // version needed
    writeUint16LE(localHeader, 6, 0);         // flags
    writeUint16LE(localHeader, 8, 0);         // method = store
    writeUint16LE(localHeader, 10, now.time);
    writeUint16LE(localHeader, 12, now.date);
    writeUint32LE(localHeader, 14, crc);
    writeUint32LE(localHeader, 18, size);     // compressed size
    writeUint32LE(localHeader, 22, size);     // uncompressed size
    writeUint16LE(localHeader, 26, nameBytes.length);
    writeUint16LE(localHeader, 28, 0);        // extra length
    localHeader.set(nameBytes, 30);

    localParts.push(localHeader, data);

    var centralHeader = new Uint8Array(46 + nameBytes.length);
    writeUint32LE(centralHeader, 0, 0x02014b50);
    writeUint16LE(centralHeader, 4, 20);      // version made by
    writeUint16LE(centralHeader, 6, 20);      // version needed
    writeUint16LE(centralHeader, 8, 0);       // flags
    writeUint16LE(centralHeader, 10, 0);      // method
    writeUint16LE(centralHeader, 12, now.time);
    writeUint16LE(centralHeader, 14, now.date);
    writeUint32LE(centralHeader, 16, crc);
    writeUint32LE(centralHeader, 20, size);
    writeUint32LE(centralHeader, 24, size);
    writeUint16LE(centralHeader, 28, nameBytes.length);
    writeUint16LE(centralHeader, 30, 0);      // extra length
    writeUint16LE(centralHeader, 32, 0);      // comment length
    writeUint16LE(centralHeader, 34, 0);      // disk number start
    writeUint16LE(centralHeader, 36, 0);      // internal attrs
    writeUint32LE(centralHeader, 38, 0);      // external attrs
    writeUint32LE(centralHeader, 42, offset);
    centralHeader.set(nameBytes, 46);

    centralParts.push(centralHeader);

    offset += localHeader.length + data.length;
  });

  var centralSize = centralParts.reduce(function(s,p){return s+p.length;}, 0);
  var centralOffset = offset;

  var end = new Uint8Array(22);
  writeUint32LE(end, 0, 0x06054b50);
  writeUint16LE(end, 4, 0);
  writeUint16LE(end, 6, 0);
  writeUint16LE(end, 8, files.length);
  writeUint16LE(end, 10, files.length);
  writeUint32LE(end, 12, centralSize);
  writeUint32LE(end, 16, centralOffset);
  writeUint16LE(end, 20, 0);

  var allParts = localParts.concat(centralParts, [end]);
  return new Blob(allParts, { type: "application/zip" });

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;
    row.appendChild(name);
    var status = document.createElement("span");
    status.className = "jmq-status " + item.status;
    status.textContent = item.status === "waiting" ? "en attente" : item.status === "done" ? "\u2713 pr\u00eat" : "\u2715 erreur";
    row.appendChild(status);
    listEl.appendChild(row);
  });
}

function updateProgress(){
  var pct = state.total ? Math.round((state.done / state.total) * 100) : 0;
  barInner.style.width = pct + "%";
  countEl.textContent = state.done + " / " + state.total + " images trait\u00e9es";
}

function downloadZip(){
  if(!window.__jmpCreateZip){
    alert("Le module ZIP interne n'a pas pu se charger. Recharge la page et r\u00e9essaie.");
    return;
  }
  var okItems = state.items.filter(function(item){ return item.status === "done" && item.blob; });
  if(okItems.length === 0){ alert("Aucune image pr\u00eate \u00e0 exporter."); return; }
  zipBtn.disabled = true;
  zipBtn.textContent = "Compression en cours...";
  Promise.all(okItems.map(function(item){
    return item.blob.arrayBuffer().then(function(buf){
      return { name: item.name, data: new Uint8Array(buf) };
    });
  })).then(function(files){
    return window.__jmpCreateZip(files);
  }).then(function(content){
    var url = URL.createObjectURL(content);
    var a = document.createElement("a");
    a.href = url;
    a.download = "JMD_LAB_PRO_lot_" + Date.now() + ".zip";
    a.click();
    URL.revokeObjectURL(url);
    zipBtn.disabled = false;
    zipBtn.textContent = "\uD83D\uDCE6 T\u00e9l\u00e9charger le ZIP";
  }).catch(function(){
    alert("Erreur lors de la cr\u00e9ation du ZIP.");
    zipBtn.disabled = false;
    zipBtn.textContent = "\uD83D\uDCE6 T\u00e9l\u00e9charger le ZIP";
  });
}

window.__jmpQueueStart = function(names){
  state.items = names.map(function(n){ return { name: n, status: "waiting", blob: null }; });
  state.total = names.length;
  state.done = 0;
  ensurePanel();
  zipBtn.disabled = true;
  renderList();
  updateProgress();
};

window.__jmpQueueItem = function(index, filename, blob){
  if(!state.items[index]) return;
  state.items[index].name = filename;
  state.items[index].blob = blob;
  state.items[index].status = blob ? "done" : "error";
  state.done++;
  ensurePanel();
  renderList();
  updateProgress();
};

window.__jmpQueueFinish = function(){
  ensurePanel();
  if(state.items.some(function(i){ return i.status === "done"; })){
    zipBtn.disabled = false;
  }
};

})();  </script>
</body>
</html>
